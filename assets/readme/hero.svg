<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenClaw Memory Distill</title>
  <desc id="hero-desc">Distill conversations into structured memory: semantic classification into core (MEMORY.md), daily (memory/YYYY-MM-DD.md), and temporary, with dedup and sensitive-info skip. Shows the distill output with classified memory files.</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>
  <g id="title-block" transform="translate(56 40)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#8b949e">OPENCLAW · AGENT SKILL</text>

    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">OpenClaw Memory</text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Distill</text>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#c9d1d9">把对话蒸馏成结构化记忆 · Memory distill</text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#8b949e">语义分级 · 首次建忆 · 增量去重 · semantic tiers</text>

    <text x="0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#8b949e">MIT LICENSE · SKILL FOR OPENCLAW</text>
  </g>
  <g id="distill-panel" transform="translate(700 44)">
    <rect width="450" height="276" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="18" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="20" r="5" fill="#27c93f"/>

    <text x="78" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">❯ memory distill — done</text>
    <text x="22" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">会话 34 条 → 语义分级</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="22" y="122" fill="#8b949e">├─ MEMORY.md</text>
      <text x="170" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8b949e">核心级 · 长期记忆</text>
      <text x="390" y="122" fill="#3fb950" font-size="18">+3</text>

      <text x="22" y="152" fill="#8b949e">├─ memory/</text>
      <text x="170" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8b949e">日常级 · 今日日志</text>
      <text x="390" y="152" fill="#3fb950" font-size="18">+5</text>

      <text x="22" y="182" fill="#8b949e">└─ distill-config.json</text>
      <text x="300" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8b949e">配置 · 运行参数</text>
    </g>

    <line x1="22" y1="204" x2="428" y2="204" stroke="#30363d" stroke-width="1"/>

    <text x="22" y="238" fill="#3fb950" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">✅ 去重合并 2 · 敏感信息跳过 1</text>
  </g>
</svg>
